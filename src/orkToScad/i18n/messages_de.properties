about.title=Über ORKtoSCAD
about.version=Version {0}
about.summary=ORKtoSCAD wandelt einen OpenRocket-Entwurf (.ork) in Dateien zum Bau der Raketenteile um: OpenSCAD-Modelle (.scad), STL-Dateien für den 3D-Druck von Spitze, Übergängen, Rohren, Kupplungsrohren, Zentrierringen und Rail-Buttons sowie SVG-Pläne zum Laserschneiden von Flossen, Zentrierringen und Schotten. In OpenRocket auf „auto“ belassene Maße werden genauso berechnet, und jedes Teil lässt sich vor der Fertigung in 3D, in 2D und als OpenSCAD-Code prüfen.
