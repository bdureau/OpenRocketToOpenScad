about.title=About ORKtoSCAD
about.version=Version {0}
about.summary=ORKtoSCAD turns an OpenRocket design (.ork) into files to make the parts of your rocket: OpenSCAD models (.scad), STL files to 3D-print the nose cone, transitions, tubes, couplers, centering rings and rail buttons, and SVG plans to laser-cut the fins, centering rings and bulkheads. Dimensions left on “auto” in OpenRocket are worked out the same way, and each part can be checked in 3D, in 2D and as OpenSCAD code before it is made.
