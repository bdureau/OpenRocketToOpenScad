about.title=À propos d’ORKtoSCAD
about.version=Version {0}
about.summary=ORKtoSCAD transforme une fusée conçue avec OpenRocket (.ork) en fichiers pour fabriquer ses pièces : modèles OpenSCAD (.scad), fichiers STL pour imprimer en 3D l’ogive, les transitions, les tubes, les coupleurs, les bagues de centrage et les patins de rail, et plans SVG pour découper au laser les ailerons, les bagues de centrage et les cloisons. Les cotes laissées sur « auto » dans OpenRocket sont calculées de la même façon, et chaque pièce peut être vérifiée en 3D, en 2D et en code OpenSCAD avant d’être fabriquée.
