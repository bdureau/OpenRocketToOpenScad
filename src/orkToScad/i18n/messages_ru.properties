about.title=О программе ORKtoSCAD
about.version=Версия {0}
about.summary=ORKtoSCAD превращает проект OpenRocket (.ork) в файлы для изготовления деталей ракеты: модели OpenSCAD (.scad), файлы STL для 3D-печати головного обтекателя, переходников, труб, соединительных муфт, центрирующих колец и направляющих роликов, а также чертежи SVG для лазерной резки стабилизаторов, центрирующих колец и перегородок. Размеры, оставленные в OpenRocket как «auto», рассчитываются тем же способом, и каждую деталь можно проверить в 3D, в 2D и в виде кода OpenSCAD до изготовления.
