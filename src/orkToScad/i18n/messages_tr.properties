about.version=Sürüm {0}
about.summary=ORKtoSCAD, bir OpenRocket tasarımını (.ork) roketinizin parçalarını üretmek için dosyalara dönüştürür: OpenSCAD modelleri (.scad); burun konisi, geçişler, borular, bağlantı boruları, merkezleme halkaları ve ray düğmeleri için 3B baskıya hazır STL dosyaları; kanatçıklar, merkezleme halkaları ve bölmeler için lazerle kesime hazır SVG planları. OpenRocket’te “auto” bırakılan ölçüler aynı şekilde hesaplanır ve her parça üretilmeden önce 3B, 2B ve OpenSCAD kodu olarak kontrol edilebilir.
