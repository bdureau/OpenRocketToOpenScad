about.title=Over ORKtoSCAD
about.version=Versie {0}
about.summary=ORKtoSCAD zet een OpenRocket-ontwerp (.ork) om in bestanden om de onderdelen van je raket te maken: OpenSCAD-modellen (.scad), STL-bestanden om de neuskegel, overgangen, buizen, koppelbuizen, centreerringen en railknoppen in 3D te printen, en SVG-plannen om de vinnen, centreerringen en schotten met de laser te snijden. Maten die in OpenRocket op „auto” staan, worden op dezelfde manier berekend, en elk onderdeel kan vóór het maken in 3D, in 2D en als OpenSCAD-code worden gecontroleerd.
