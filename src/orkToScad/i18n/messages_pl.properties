about.title=O programie ORKtoSCAD
about.version=Wersja {0}
about.summary=ORKtoSCAD zamienia projekt OpenRocket (.ork) na pliki do wykonania części rakiety: modele OpenSCAD (.scad), pliki STL do druku 3D stożka nosowego, przejść, rur, łączników, pierścieni centrujących i ślizgów prowadnicy oraz plany SVG do cięcia laserem stateczników, pierścieni centrujących i przegród. Wymiary pozostawione w OpenRocket jako „auto” są obliczane w ten sam sposób, a każdą część można sprawdzić w 3D, w 2D i jako kod OpenSCAD przed jej wykonaniem.
