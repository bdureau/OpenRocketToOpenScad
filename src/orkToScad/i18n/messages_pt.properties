about.title=Sobre o ORKtoSCAD
about.version=Versão {0}
about.summary=O ORKtoSCAD transforma um projeto do OpenRocket (.ork) em arquivos para fabricar as peças do foguete: modelos OpenSCAD (.scad), arquivos STL para imprimir em 3D a ogiva, as transições, os tubos, os acopladores, os anéis centralizadores e os botões de trilho, e planos SVG para cortar a laser as aletas, os anéis centralizadores e as anteparas. As medidas deixadas em “auto” no OpenRocket são calculadas da mesma forma, e cada peça pode ser conferida em 3D, em 2D e como código OpenSCAD antes de ser fabricada.
