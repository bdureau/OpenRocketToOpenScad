about.title=Acerca de ORKtoSCAD
about.version=Versión {0}
about.summary=ORKtoSCAD convierte un diseño de OpenRocket (.ork) en archivos para fabricar las piezas del cohete: modelos OpenSCAD (.scad), archivos STL para imprimir en 3D el cono de nariz, las transiciones, los tubos, los acopladores, los anillos de centrado y los botones de riel, y planos SVG para cortar con láser las aletas, los anillos de centrado y los mamparos. Las medidas que se dejan en «auto» en OpenRocket se calculan del mismo modo, y cada pieza puede revisarse en 3D, en 2D y como código OpenSCAD antes de fabricarla.
