about.title=Informazioni su ORKtoSCAD
about.version=Versione {0}
about.summary=ORKtoSCAD trasforma un progetto OpenRocket (.ork) in file per realizzare i pezzi del razzo: modelli OpenSCAD (.scad), file STL per stampare in 3D l’ogiva, le transizioni, i tubi, i giunti, gli anelli di centraggio e i pattini per rotaia, e piani SVG per tagliare al laser le alette, gli anelli di centraggio e le paratie. Le quote lasciate su «auto» in OpenRocket vengono calcolate allo stesso modo, e ogni pezzo può essere controllato in 3D, in 2D e come codice OpenSCAD prima di realizzarlo.
