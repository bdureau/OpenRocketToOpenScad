about.summary=Az ORKtoSCAD egy OpenRocket-tervet (.ork) alakít át a rakéta alkatrészeinek elkészítéséhez szükséges fájlokká: OpenSCAD-modellekké (.scad), az orrkúp, az átmenetek, a csövek, a csatlakozócsövek, a központosító gyűrűk és a sínvezető gombok 3D-nyomtatásához STL-fájlokká, valamint a vezérsíkok, a központosító gyűrűk és a válaszfalak lézervágásához SVG-tervekké. Az OpenRocketben „auto” értéken hagyott méreteket ugyanúgy számítja ki, és minden alkatrész elkészítés előtt ellenőrizhető 3D-ben, 2D-ben és OpenSCAD-kódként.
